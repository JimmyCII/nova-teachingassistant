[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teacher-mind"
version = "0.1.0"
description = "TeacherMind AI Concierge Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "google-adk>=0.3.0",
    "canvasapi>=3.3.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "openpyxl>=3.1.0",
    "google-api-python-client>=2.130.0",
    "google-auth-oauthlib>=1.2.0",
    "mcp>=1.2.0",
    "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio"
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "web"]
